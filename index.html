<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://analytics.ahrefs.com/analytics.js" data-key="6ArYZy3YV6DRXGDfjhKzpA" async></script>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Douglas A. Ley</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    .main-profile-pic {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 20px auto; /* centers the image horizontally */
    }

    .profile-section {
      text-align: center;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .main-profile-pic {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>
  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;

        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        if (hamburger && navLinks) {
          hamburger.addEventListener('click', () => {
            const expanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', String(!expanded));
            navLinks.classList.toggle('active');
          });

          const dropdownLinks = document.querySelectorAll('.dropdown > .nav-link');

          function isMobile() {
            return window.matchMedia("(max-width: 768px)").matches;
          }

          dropdownLinks.forEach(link => {
            link.addEventListener('click', e => {
              if (!isMobile()) return;
              e.preventDefault();
              const parent = link.parentElement;
              parent.classList.toggle('open');
              const expanded = link.getAttribute('aria-expanded') === 'true';
              link.setAttribute('aria-expanded', String(!expanded));
            });
          });

          document.body.addEventListener('click', (event) => {
            if (!isMobile()) return;

            const nav = document.querySelector('.topnav');
            if (nav && !nav.contains(event.target)) {
              dropdownLinks.forEach(link => {
                const parent = link.parentElement;
                parent.classList.remove('open');
                link.setAttribute('aria-expanded', 'false');
              });
              if (navLinks.classList.contains('active')) {
                navLinks.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
              }
            }
          });

        } else {
          console.error('Hamburger or Navigation Links not found after loading navbar.html. Menu functionality may be limited.');
        }
      })
      .catch(err => console.error('Failed to load navbar:', err));
  </script>

  <div class="container">
    <h1>Douglas A. Ley</h1>

    <div class="profile-section">
      <img src="profilepicture.png" alt="Douglas A. Ley Profile" class="main-profile-pic" />
      <p>Client-Facing Project Manager | Technical & Legal Consulting | CRM & Account Management Experience</p>
    </div>

    <section>
      <h2>Welcome!</h2>
      <p>More content coming soon!</p>
    </section>
  </div>

  <footer class="footer">&copy; Douglas A. Ley 2025</footer>

</body>
</html>
