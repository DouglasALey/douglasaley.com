<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Douglas A. Ley</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="navbar-placeholder"></div>
  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;

        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links'); // Or use document.getElementById('nav-links');

        // Check if both elements exist before attaching listeners
        if (hamburger && navLinks) {
          hamburger.addEventListener('click', () => {
            const expanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', String(!expanded));
            navLinks.classList.toggle('active');
          });

          const dropdownLinks = document.querySelectorAll('.dropdown > .nav-link');

          function isMobile() {
            return window.matchMedia("(max-width: 768px)").matches;
          }

          dropdownLinks.forEach(link => {
            link.addEventListener('click', e => {
              if (!isMobile()) return; // Only toggle dropdown on mobile
              e.preventDefault(); // Prevent default link behavior on mobile for dropdowns
              const parent = link.parentElement;
              parent.classList.toggle('open');
              const expanded = link.getAttribute('aria-expanded') === 'true';
              link.setAttribute('aria-expanded', String(!expanded));
            });
          });

          // Close dropdowns and main nav menu if clicking outside on mobile
          document.body.addEventListener('click', (event) => {
            if (!isMobile()) return;

            const nav = document.querySelector('.topnav'); // Get the navigation element
            // Check if the click occurred outside the navigation area
            if (nav && !nav.contains(event.target)) {
              // Close all dropdowns
              dropdownLinks.forEach(link => {
                const parent = link.parentElement;
                parent.classList.remove('open');
                link.setAttribute('aria-expanded', 'false');
              });
              // Close the main navigation menu if it's open
              if (navLinks.classList.contains('active')) {
                  navLinks.classList.remove('active');
                  hamburger.setAttribute('aria-expanded', 'false');
              }
            }
          });

        } else {
            console.error('Hamburger or Navigation Links not found after loading navbar.html. Menu functionality may be limited.');
        }
      })
      .catch(err => console.error('Failed to load navbar:', err));
  </script>

  <div class="container">
    <h1>Douglas A. Ley</h1>
    <p>Client-Facing Project Manager | Legal & Technical Consulting | CRM & Account Management Experience</p>
    <section>
      <h2>Welcome!</h2>
      <p>More content coming soon!</p>
    </section>
  </div>

  <footer class="footer">&copy; Douglas A. Ley 2025</footer>

</body>
</html>
