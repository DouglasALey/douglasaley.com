<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Douglas A. Ley</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Navigation: Load from external navbar.html -->
  <div id="navbar-placeholder"></div>
  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;

        // After injecting navbar, initialize hamburger and dropdown behavior
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger?.addEventListener('click', () => {
          const expanded = hamburger.getAttribute('aria-expanded') === 'true';
          hamburger.setAttribute('aria-expanded', String(!expanded));
          navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.dropdown > .nav-link').forEach(link => {
          link.addEventListener('click', e => {
            if (window.innerWidth <= 768) {
              e.preventDefault();
              const parent = link.parentElement;
              parent.classList.toggle('open');
              const expanded = link.getAttribute('aria-expanded') === 'true';
              link.setAttribute('aria-expanded', String(!expanded));
            }
          });
        });
      })
      .catch(err => console.error('Failed to load navbar:', err));
  </script>

  <!-- Page Content -->
  <div class="container">
    <h1>Douglas A. Ley</h1>
    <p>Project & Product Manager | JMU Alumni</p>
    <section>
      <h2>Welcome</h2>
      <p>This is my personal website — more content coming soon!</p>
    </section>
  </div>

  <!-- Footer -->
  <footer class="footer">&copy; Douglas A. Ley 2025</footer>

</body>
</html>
